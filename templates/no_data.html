<!DOCTYPE html>
<html lang="{{ html_lang }}">
<head>
    <title>Sharefolio - {{ t('no_data.title') }}</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="{{ url_for('static', filename='assets/plugins/fontawesome/js/all.min.js') }}"></script>
    <link id="theme-style" rel="stylesheet" href="{{ url_for('static', filename='assets/css/portal.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
</head>

<body class="app">
    {% include "_header.html" %}

    <div class="app-wrapper">
		<div class="container-xl">
			<div class="text-center" style="padding: 80px 0 60px;">
				<div style="font-size:4rem;margin-bottom:24px;opacity:0.25;">
					<i class="fa-solid fa-chart-column"></i>
				</div>
				<h2 class="mb-3">{{ t('no_data.title') }}</h2>
				<p class="text-muted mb-5" style="max-width:460px;margin:0 auto 2rem;">
					{{ t('no_data.body') }}
				</p>
				<div class="d-flex justify-content-center gap-3 flex-wrap">
					<a href="{{ url_for('add_trade') }}" class="btn app-btn-primary">
						<i class="fa-solid fa-plus me-1"></i> {{ t('no_data.add_trade') }}
					</a>
					<a href="{{ url_for('trades') }}" class="btn app-btn-secondary">
						<i class="fa-solid fa-upload me-1"></i> {{ t('no_data.upload_csv') }}
					</a>
				</div>
				<p class="text-muted mt-5 small">
					{{ t('no_data.help_prefix') }} <a href="{{ url_for('info') }}">{{ t('no_data.help_link') }}</a> {{ t('no_data.help_suffix') }}
				</p>
			</div>
		</div>

	    {% include "_footer.html" %}
    </div>

	<script src="{{ url_for('static', filename='assets/plugins/popper.min.js') }}"></script>
	<script src="{{ url_for('static', filename='assets/plugins/bootstrap/js/bootstrap.min.js') }}"></script>
	<script src="{{ url_for('static', filename='assets/js/app.js') }}"></script>
	{% include "loading.html" %}
</body>
</html>
