<!DOCTYPE html>
<html lang="{{ html_lang }}"> 
<head>
    <title>Sharefolio - {{ t('edit_income.title') }}</title>
    
    <!-- Meta -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="Sharefolio">
    <meta name="author" content="Ivan YeH">    
    <!-- <link rel="shortcut icon" href="favicon.ico">  -->
    
    <!-- FontAwesome JS-->
    <!-- <script defer src="assets/plugins/fontawesome/js/all.min.js"></script> -->
    <script defer src="{{ url_for('static', filename='assets/plugins/fontawesome/js/all.min.js') }}"></script>
    
    <!-- App CSS -->  
    <!-- <link id="theme-style" rel="stylesheet" href="assets/css/portal.css"> -->
    <link id="theme-style" rel="stylesheet" href="{{ url_for('static', filename='assets/css/portal.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head> 

<body class="app">   	
    {% set active_page = 'incomes' %}
    {% include "_header.html" %}
    
    <div class="app-wrapper">
	    <div class="container-xl">
			<div class="app-content pt-3 p-md-3 p-lg-4">
				<div class="col-auto">
					<h1 class="app-page-title mb-0">{{ t('edit_income.title') }}</h1>
					<br>
				</div>
				<form method="POST" action="{{ url_for('update_income', income_id=income['id']) }}" class="row g-3">
					<!-- Hidden Income ID (used for editing) -->
					<input type="hidden" name="income_id" value="{{ income.id if income else '' }}">

					<!-- Date -->
					<div class="col-md-4">
						<label for="date" class="form-label">{{ t('common.date') }}</label>
						<input type="date" id="date" name="date" class="form-control" required
							value="{{ income.date if income else '' }}">
					</div>

					<!-- Holdings -->
					<div class="col-md-4">
						<label for="holding" class="form-label">{{ t('common.holding') }}</label>
						<select id="holding" name="holding" class="form-select" required>
							<option value="" disabled {% if not income %}selected{% endif %}>{{ t('common.select_holding') }}</option>
							{% for ticker, exchange, currency in holdings %}
								{% set value = ticker ~ '|' ~ exchange ~ '|' ~ currency %}
								<option value="{{ value }}"
									{% if income and income.ticker == ticker and income.exchange == exchange and income.currency == currency %}selected{% endif %}>
									{{ ticker }} ({{ exchange_names[exchange] }}, {{ currency }} {{ currency_icons[currency] }})
								</option>
							{% endfor %}
						</select>
					</div>

					<!-- FX (optional) -->
					<div class="col-md-4">
						<label for="fx" class="form-label">{{ t('common.fx_optional') }}</label>
						<input type="number" step="any" id="fx" name="fx" class="form-control"
							value="{{ income.fx if income and income.fx is not none else '' }}">
					</div>

					<!-- Amount -->
					<div class="col-md-4">
						<label for="amount" class="form-label">{{ t('common.amount') }}</label>
						<input type="number" step="any" id="amount" name="amount" class="form-control" required
							value="{{ income.amount if income else '' }}">
					</div>

					<!-- Imputation -->
					<div class="col-md-4">
						<label for="imputation" class="form-label">{{ t('common.tax_credit') }}</label>
						<input type="number" step="any" id="imputation" name="imputation" class="form-control" required
							value="{{ income.imputation if income else '' }}">
					</div>

					<!-- Fees -->
					<div class="col-md-4">
						<label for="fees" class="form-label">{{ t('common.fees') }}</label>
						<input type="number" step="any" id="fees" name="fees" class="form-control" required
							value="{{ income.fees if income else '' }}">
					</div>

					<!-- Note (optional) -->
					<div class="col-12">
						<label for="note" class="form-label">{{ t('common.note_optional') }}</label>
						<textarea id="note" name="note" class="form-control" rows="2">{{ income.note if income else '' }}</textarea>
					</div>

					<!-- Submit -->
					<div class="col-md-2">
						<button type="submit" class="btn app-btn-primary">
							{% if income %}{{ t('common.save_changes') }}{% else %}{{ t('add_income.submit') }}{% endif %}
						</button>
					</div>
				</form>

				<br>

				{% if income %}
					<form action="{{ url_for('delete_income_route', income_id=income.id) }}" method="POST"
						onsubmit="return confirm('{{ t('edit_income.confirm_delete') }}');">
						<button type="submit" class="btn btn-danger">{{ t('common.delete') }}</button>
					</form>
					<br>
				{% endif %}

				<div class="col-md-3">
					<a class="btn app-btn-secondary" href="/incomes">{{ t('common.cancel') }}</a>
				</div>

				
				
			</div>
		</div>
	    
	    {% include "_footer.html" %}
    </div><!--//app-wrapper-->    					


	<!-- JavaScript -->
	<script src="{{ url_for('static', filename='assets/plugins/popper.min.js') }}"></script>
	<script src="{{ url_for('static', filename='assets/plugins/bootstrap/js/bootstrap.min.js') }}"></script>

	<!-- Charts JS -->
	<script src="{{ url_for('static', filename='assets/plugins/chart.js/chart.min.js') }}"></script>
	<script src="{{ url_for('static', filename='assets/js/index-charts.js') }}"></script>

	<!-- Page-Specific JS -->
	<script src="{{ url_for('static', filename='assets/js/app.js') }}"></script>

	{% include "loading.html" %}

</body>
</html>
