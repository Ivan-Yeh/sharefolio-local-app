<!DOCTYPE html>
<html lang="{{ html_lang }}"> 
<head>
    <title>Sharefolio - {{ t('500.title') }}</title>
    
    <!-- Meta -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="Sharefolio">
    <meta name="author" content="Ivan YeH">    
    <!-- <link rel="shortcut icon" href="favicon.ico">  -->
    
    <!-- FontAwesome JS-->
    <!-- <script defer src="assets/plugins/fontawesome/js/all.min.js"></script> -->
    <script defer src="{{ url_for('static', filename='assets/plugins/fontawesome/js/all.min.js') }}"></script>
    
    <!-- App CSS -->  
    <!-- <link id="theme-style" rel="stylesheet" href="assets/css/portal.css"> -->
    <link id="theme-style" rel="stylesheet" href="{{ url_for('static', filename='assets/css/portal.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head> 

<body class="app">   	
    {% include "_header.html" %}
    
    <div class="app-wrapper">
	    <div class="container-xl">
			<div class="text-center" style="padding: 80px 0 60px;">
				<div style="font-size:3.5rem;margin-bottom:20px;color:#ef4444;opacity:0.35;">
					<i class="fa-solid fa-triangle-exclamation"></i>
				</div>
				<h1 style="font-size:5rem;font-weight:800;color:rgba(0,0,0,0.08);margin-bottom:-16px;">500</h1>
				<h2 class="mb-3" style="font-weight:700;">{{ t('500.title') }}</h2>
				<p class="text-muted mb-4" style="max-width:480px;margin:0 auto 1.5rem;">
					{{ t('500.body_prefix') }}
					<a href="/trades">{{ t('500.body_trades') }}</a> {{ t('500.body_and') }} <a href="/incomes">{{ t('500.body_incomes') }}</a> {{ t('500.body_suffix') }}
				</p>
				<div class="d-flex justify-content-center gap-3 flex-wrap">
					<a href="{{ url_for('trades') }}" class="btn app-btn-primary">
						<i class="fa-solid fa-money-bill-transfer me-2"></i> {{ t('500.check_trades') }}
					</a>
					<a href="{{ url_for('info') }}" class="btn app-btn-secondary">
						<i class="fa-solid fa-circle-info me-2"></i> {{ t('500.help') }}
					</a>
				</div>
			</div>
		</div>
	    
	    {% include "_footer.html" %}
	    
    </div><!--//app-wrapper-->    					


	<!-- JavaScript -->
	<script src="{{ url_for('static', filename='assets/plugins/popper.min.js') }}"></script>
	<script src="{{ url_for('static', filename='assets/plugins/bootstrap/js/bootstrap.min.js') }}"></script>

	<!-- Charts JS -->
	<script src="{{ url_for('static', filename='assets/plugins/chart.js/chart.min.js') }}"></script>
	<script src="{{ url_for('static', filename='assets/js/index-charts.js') }}"></script>

	<!-- Page-Specific JS -->
	<script src="{{ url_for('static', filename='assets/js/app.js') }}"></script>
	
	{% include "loading.html" %}

</body>
</html>
