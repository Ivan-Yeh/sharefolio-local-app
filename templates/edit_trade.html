<!DOCTYPE html>
<html lang="{{ html_lang }}"> 
<head>
    <title>Sharefolio - {{ t('edit_trade.title') }}</title>
    
    <!-- Meta -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="Sharefolio">
    <meta name="author" content="Ivan YeH">    
    <!-- <link rel="shortcut icon" href="favicon.ico">  -->
    
    <!-- FontAwesome JS-->
    <!-- <script defer src="assets/plugins/fontawesome/js/all.min.js"></script> -->
    <script defer src="{{ url_for('static', filename='assets/plugins/fontawesome/js/all.min.js') }}"></script>
    
    <!-- App CSS -->  
    <!-- <link id="theme-style" rel="stylesheet" href="assets/css/portal.css"> -->
    <link id="theme-style" rel="stylesheet" href="{{ url_for('static', filename='assets/css/portal.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head> 

<body class="app">   	
    {% set active_page = 'trades' %}
    {% include "_header.html" %}
    
    <div class="app-wrapper">
	    <div class="container-xl">
			<div class="app-content pt-3 p-md-3 p-lg-4">
				<div class="col-auto">
					<h1 class="app-page-title mb-0">{{ t('edit_trade.title') }}</h1>
					<br>
				</div>
				<form method="POST" action="{{ url_for('update_trade', trade_id=trade['id']) }}" class="row g-3">

					<!-- Date -->
					<div class="col-md-4">
						<label for="date" class="form-label">{{ t('common.date') }}</label>
						<input type="date" id="date" name="date" class="form-control" required value="{{ trade['date'] }}">
					</div>

					<!-- Ticker -->
					<div class="col-md-4">
						<label for="ticker" class="form-label">{{ t('common.ticker') }}</label>
						<input type="text" id="ticker" name="ticker" class="form-control" required value="{{ trade['ticker'] }}">
					</div>

					<!-- Currency -->
					<div class="col-md-4">
						<label for="currency" class="form-label">{{ t('common.currency') }}</label>
						<select id="currency" name="currency" class="form-select" required>
							<option value="" disabled>{{ t('common.select_currency') }}</option>
							{% for ccy in currencies %}
								<option value="{{ ccy }}" {% if ccy == trade['currency'] %}selected{% endif %}>
									{{ ccy }} {{ currency_icons[ccy] }}
								</option>
							{% endfor %}
						</select>
					</div>

					<!-- Exchange -->
					<div class="col-md-4">
						<label for="exchange" class="form-label">{{ t('common.exchange') }}</label>
						<select id="exchange" name="exchange" class="form-select" required>
							<option value="" disabled>{{ t('common.select_exchange') }}</option>
							{% for exch in exchanges %}
								<option value="{{ exch }}" {% if exch == trade['exchange'] %}selected{% endif %}>
									{{ exchange_names[exch] }}
								</option>
							{% endfor %}
						</select>
					</div>

					<!-- FX (optional) -->
					<div class="col-md-4">
						<label for="fx" class="form-label">{{ t('common.fx_optional') }}</label>
						<input type="number" step="any" id="fx" name="fx" class="form-control" value="{{ trade['fx'] or '' }}">
					</div>

					<!-- Type -->
					<div class="col-md-4">
						<label for="type" class="form-label">{{ t('common.type') }}</label>
						<select id="type" name="type" class="form-select" required>
							<option value="" disabled>{{ t('add_trade.type_select') }}</option>
							<option value="BUY" {% if trade['type'] == 'BUY' %}selected{% endif %}>BUY</option>
							<option value="SELL" {% if trade['type'] == 'SELL' %}selected{% endif %}>SELL</option>
							<option value="ADJUSTMENT" {% if trade['type'] == 'ADJUSTMENT' %}selected{% endif %}>ADJUSTMENT</option>
						</select>
					</div>

					<!-- Quantity -->
					<div class="col-md-4">
						<label for="quantity" class="form-label">{{ t('common.quantity') }}</label>
						<input type="number" step="any" id="quantity" name="quantity" class="form-control" required value="{{ trade['quantity'] }}">
					</div>

					<!-- Price -->
					<div class="col-md-4">
						<label for="price" class="form-label">{{ t('common.price') }}</label>
						<input type="number" step="any" id="price" name="price" class="form-control" required value="{{ trade['price'] }}">
					</div>

					<!-- Fees -->
					<div class="col-md-4">
						<label for="fees" class="form-label">{{ t('common.fees') }}</label>
						<input type="number" step="any" id="fees" name="fees" class="form-control" required value="{{ trade['fees'] }}">
					</div>

					<!-- Note (optional) -->
					<div class="col-12">
						<label for="note" class="form-label">{{ t('common.note_optional') }}</label>
						<textarea id="note" name="note" class="form-control" rows="2">{{ trade['note'] }}</textarea>
					</div>

					<!-- Buttons -->
					<div class="col-md-3">
						<button type="submit" class="btn app-btn-primary loading">{{ t('common.save_changes') }}</button>
					</div>
				</form>
				<br>
				<form action="{{ url_for('delete_trade_route', trade_id=trade['id']) }}" method="POST" onsubmit="return confirm('{{ t('edit_trade.confirm_delete') }}');">
					<button type="submit" class="btn btn-danger loading">{{ t('common.delete') }}</button>
				</form>
				<br>
				<div class="col-md-3">
					<a class="btn app-btn-secondary loading" href="/trades">{{ t('common.cancel') }}</a>
				</div>

			</div>
		</div>
	    
	    {% include "_footer.html" %}
    </div><!--//app-wrapper-->    					


	<!-- JavaScript -->
	<script src="{{ url_for('static', filename='assets/plugins/popper.min.js') }}"></script>
	<script src="{{ url_for('static', filename='assets/plugins/bootstrap/js/bootstrap.min.js') }}"></script>

	<!-- Charts JS -->
	<script src="{{ url_for('static', filename='assets/plugins/chart.js/chart.min.js') }}"></script>
	<script src="{{ url_for('static', filename='assets/js/index-charts.js') }}"></script>

	<!-- Page-Specific JS -->
	<script src="{{ url_for('static', filename='assets/js/app.js') }}"></script>

	{% include "loading.html" %}

</body>
</html>
