<!DOCTYPE html>
<html lang="{{ html_lang }}"> 
<head>
    <title>Sharefolio - {{ t('add_trade.title') }}</title>
    
    <!-- Meta -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="Sharefolio">
    <meta name="author" content="Ivan YeH">    
    <!-- <link rel="shortcut icon" href="favicon.ico">  -->
    
    <!-- FontAwesome JS-->
    <!-- <script defer src="assets/plugins/fontawesome/js/all.min.js"></script> -->
    <script defer src="{{ url_for('static', filename='assets/plugins/fontawesome/js/all.min.js') }}"></script>
    
    <!-- App CSS -->  
    <!-- <link id="theme-style" rel="stylesheet" href="assets/css/portal.css"> -->
    <link id="theme-style" rel="stylesheet" href="{{ url_for('static', filename='assets/css/portal.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head> 

<body class="app">   	
    {% set active_page = 'trades' %}
    {% include "_header.html" %}
    
    <div class="app-wrapper">
	    <div class="container-xl">
			<div class="app-content pt-3 p-md-3 p-lg-4">
				<div class="col-auto">
					<h1 class="app-page-title mb-0">{{ t('add_trade.title') }}</h1>
					<br>
				</div>
				<form method="POST" action="{{ url_for('add_trade') }}" class="row g-3">
					<!-- Date -->
					<div class="col-md-4">
						<label for="date" class="form-label">{{ t('common.date') }}</label>
						<input type="date" id="date" name="date" class="form-control" required>
					</div>

					<!-- Ticker -->
					<div class="col-md-4">
						<label for="ticker" class="form-label">{{ t('common.ticker') }}</label>
						<input type="text" id="ticker" name="ticker" class="form-control" required>
					</div>

					<!-- Currency -->
					<div class="col-md-4">
						<label for="currency" class="form-label">{{ t('common.currency') }}</label>
						<select id="currency" name="currency" class="form-select" required>
							<option value="" disabled selected>{{ t('common.select_currency') }}</option>
							{% for ccy in currencies %}
								<option value="{{ ccy }}">{{ ccy }} {{ currency_icons[ccy] }}</option>
							{% endfor %}
						</select>
					</div>

					<!-- Exchange -->
					<div class="col-md-4">
						<label for="exchange" class="form-label">{{ t('common.exchange') }}</label>
						<select id="exchange" name="exchange" class="form-select" required>
							<option value="" disabled selected>{{ t('common.select_exchange') }}</option>
							{% for exch in exchanges %}
								<option value="{{ exch }}">{{ exchange_names[exch] }}</option>
							{% endfor %}
						</select>
					</div>

					<!-- FX (optional) -->
					<div class="col-md-4">
						<label for="fx" class="form-label">{{ t('common.fx_optional') }}</label>
						<input type="number" step="any" id="fx" name="fx" class="form-control">
					</div>

					<!-- Type -->
					<div class="col-md-4">
						<label for="type" class="form-label">{{ t('common.type') }}</label>
						<select id="type" name="type" class="form-select" required>
							<option value="" disabled selected>{{ t('add_trade.type_select') }}</option>
							<option value="BUY">BUY</option>
							<option value="SELL">SELL</option>
							<option value="SELL">ADJUSTMENT</option>
						</select>
					</div>

					<!-- Quantity -->
					<div class="col-md-4">
						<label for="quantity" class="form-label">{{ t('common.quantity') }}</label>
						<input type="number" step="any" id="quantity" name="quantity" class="form-control" required>
					</div>

					<!-- Price -->
					<div class="col-md-4">
						<label for="price" class="form-label">{{ t('common.price') }}</label>
						<input type="number" step="any" id="price" name="price" class="form-control" required>
					</div>

					<!-- Fees -->
					<div class="col-md-4">
						<label for="fees" class="form-label">{{ t('common.fees') }}</label>
						<input type="number" step="any" id="fees" name="fees" class="form-control" required>
					</div>

					<!-- Note (optional) -->
					<div class="col-12">
						<label for="note" class="form-label">{{ t('common.note_optional') }}</label>
						<textarea id="note" name="note" class="form-control" rows="2"></textarea>
					</div>

					<!-- Submit button -->
					<div class="col-md-2">
						<button type="submit" class="btn app-btn-primary">{{ t('add_trade.submit') }}</button>
					</div>

					<div class="col-md-2">
					<a class="btn app-btn-secondary" href="/trades">
						{{ t('common.cancel') }}
					</a>
				</div>

				</form>
				
			</div>
		</div>
	    
	    {% include "_footer.html" %}
    </div><!--//app-wrapper-->    					


	<!-- JavaScript -->
	<script src="{{ url_for('static', filename='assets/plugins/popper.min.js') }}"></script>
	<script src="{{ url_for('static', filename='assets/plugins/bootstrap/js/bootstrap.min.js') }}"></script>

	<!-- Charts JS -->
	<script src="{{ url_for('static', filename='assets/plugins/chart.js/chart.min.js') }}"></script>
	<script src="{{ url_for('static', filename='assets/js/index-charts.js') }}"></script>

	<!-- Page-Specific JS -->
	<script src="{{ url_for('static', filename='assets/js/app.js') }}"></script>

	{% include "loading.html" %}

</body>
</html>
