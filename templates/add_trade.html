			<div class="app-content pt-3 p-md-3 p-lg-4">
				<div class="col-auto">
					<h1 class="app-page-title mb-0">Enter A New Trade</h1>
					<br>
				</div>
				<form method="POST" action="{{ url_for('add_trade') }}" class="row g-3">
					<!-- Date -->
					<div class="col-md-4">
						<label for="date" class="form-label">Date</label>
						<input type="date" id="date" name="date" class="form-control" required>
					</div>

					<!-- Ticker -->
					<div class="col-md-4">
						<label for="ticker" class="form-label">Ticker</label>
						<input type="text" id="ticker" name="ticker" class="form-control" required>
					</div>

					<!-- Currency -->
					<div class="col-md-4">
						<label for="currency" class="form-label">Currency</label>
						<select id="currency" name="currency" class="form-select" required>
							<option value="" disabled selected>Select currency</option>
							{% for ccy in currencies %}
								<option value="{{ ccy }}">{{ ccy }} {{ currency_icons[ccy] }}</option>
							{% endfor %}
						</select>
					</div>

					<!-- Exchange -->
					<div class="col-md-4">
						<label for="exchange" class="form-label">Exchange</label>
						<select id="exchange" name="exchange" class="form-select" required>
							<option value="" disabled selected>Select exchange</option>
							{% for exch in exchanges %}
								<option value="{{ exch }}">{{ exchange_names[exch] }}</option>
							{% endfor %}
						</select>
					</div>

					<!-- FX (optional) -->
					<div class="col-md-4">
						<label for="fx" class="form-label">FX (Base Currency ÷ Asset Currency) (optional)</label>
						<input type="number" step="any" id="fx" name="fx" class="form-control">
					</div>

					<!-- Type -->
					<div class="col-md-4">
						<label for="type" class="form-label">Type</label>
						<select id="type" name="type" class="form-select" required>
							<option value="" disabled selected>Select Trade Type</option>
							<option value="BUY">BUY</option>
							<option value="SELL">SELL</option>
							<option value="SELL">ADJUSTMENT</option>
						</select>
					</div>

					<!-- Quantity -->
					<div class="col-md-4">
						<label for="quantity" class="form-label">Quantity</label>
						<input type="number" step="any" id="quantity" name="quantity" class="form-control" required>
					</div>

					<!-- Price -->
					<div class="col-md-4">
						<label for="price" class="form-label">Price</label>
						<input type="number" step="any" id="price" name="price" class="form-control" required>
					</div>

					<!-- Fees -->
					<div class="col-md-4">
						<label for="fees" class="form-label">Fees</label>
						<input type="number" step="any" id="fees" name="fees" class="form-control" required>
					</div>

					<!-- Note (optional) -->
					<div class="col-12">
						<label for="note" class="form-label">Note (optional)</label>
						<textarea id="note" name="note" class="form-control" rows="2"></textarea>
					</div>

					<!-- Submit button -->
					<div class="col-md-2">
						<button type="submit" class="btn app-btn-primary">Add Trade</button>
					</div>

					<div class="col-md-2">						    
					<a class="btn app-btn-secondary" href="/trades">
						Cancel
					</a>
				</div>

				</form>
