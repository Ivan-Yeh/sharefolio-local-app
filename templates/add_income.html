<!DOCTYPE html>
<html lang="{{ html_lang }}"> 
<head>
    <title>Sharefolio - {{ t('add_income.title') }}</title>
    
    <!-- Meta -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="Sharefolio">
    <meta name="author" content="Ivan YeH">    
    <!-- <link rel="shortcut icon" href="favicon.ico">  -->
    
    <!-- FontAwesome JS-->
    <!-- <script defer src="assets/plugins/fontawesome/js/all.min.js"></script> -->
    <script defer src="{{ url_for('static', filename='assets/plugins/fontawesome/js/all.min.js') }}"></script>
    
    <!-- App CSS -->  
    <!-- <link id="theme-style" rel="stylesheet" href="assets/css/portal.css"> -->
    <link id="theme-style" rel="stylesheet" href="{{ url_for('static', filename='assets/css/portal.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head> 

<body class="app">   	
    {% set active_page = 'incomes' %}
    {% include "_header.html" %}
    
    <div class="app-wrapper">
	    <div class="container-xl">
			<div class="app-content pt-3 p-md-3 p-lg-4">
				<div class="col-auto">
					<h1 class="app-page-title mb-0">{{ t('add_income.title') }}</h1>
					<br>
				</div>

					<form method="POST" action="{{ url_for('add_income') }}" class="row g-3">

						<!-- Income Date -->
						<div class="col-md-4">
							<label for="date" class="form-label">{{ t('common.date') }}</label>
							<input type="date" id="date" name="date" class="form-control" required>
						</div>

						<!-- Holding -->
						<div class="col-md-4">
							<label for="holding" class="form-label">{{ t('common.holding') }}</label>
							<select id="holding" name="holding" class="form-select" required>
								<option value="" disabled selected>{{ t('common.select_holding') }}</option>
								{% for ticker, exchange, currency in holdings %}
									<option value="{{ ticker }}|{{ exchange }}|{{ currency }}">
										{{ ticker }} ({{ exchange_names[exchange] }}, {{ currency }} {{ currency_icons[currency] }})
									</option>
								{% endfor %}
							</select>
						</div>

						<!-- FX -->
						<div class="col-md-4">
							<label for="fx" class="form-label">{{ t('common.fx_optional_short') }}</label>
							<input type="number" step="any" id="fx" name="fx" class="form-control">
						</div>

						<!-- Amount -->
						<div class="col-md-4">
							<label for="amount" class="form-label">{{ t('common.amount') }}</label>
							<input type="number" step="any" id="amount" name="amount" class="form-control" required>
						</div>

						<!-- Tax Credit -->
						<div class="col-md-4">
							<label for="imputation" class="form-label">{{ t('common.tax_credit') }}</label>
							<input type="number" step="any"  id="imputation" name="imputation" class="form-control" required>
						</div>

						<!-- Fees -->
						<div class="col-md-4">
							<label for="fees" class="form-label">{{ t('common.fees') }}</label>
							<input type="number" step="any" id="fees" name="fees" class="form-control" required>
						</div>

						<!-- Note -->
						<div class="col-12">
							<label for="note" class="form-label">{{ t('common.note_optional') }}</label>
							<textarea id="note" name="note" class="form-control" rows="2"></textarea>
						</div>

						<!-- DRP Toggle -->
						<div class="col-12">
							<div class="form-check">
								<input type="checkbox" class="form-check-input" id="drp-toggle" name="add_drp">
								<label class="form-check-label" for="drp-toggle">
									{{ t('add_income.drp_toggle') }}
								</label>
							</div>
						</div>

						<!-- DRP Fields -->
						<div id="drp-fields" style="display: none;" class="row g-3">
							<div class="col-md-4">
								<label for="drp_date" class="form-label">{{ t('add_income.drp_date') }}</label>
								<input type="date" id="drp_date" name="drp_date" class="form-control drp-required">
							</div>
							<div class="col-md-4">
								<label for="drp_quantity" class="form-label">{{ t('add_income.drp_quantity') }}</label>
								<input type="number" step="any"  id="drp_quantity" name="drp_quantity" class="form-control drp-required">
							</div>
							<div class="col-md-4">
								<label for="drp_price" class="form-label">{{ t('common.price') }}</label>
								<input type="number" step="any" id="drp_price" name="drp_price" class="form-control drp-required">
							</div>
							<div class="col-md-4">
								<label for="drp_fx" class="form-label">{{ t('common.fx_optional_short') }}</label>
								<input type="number" step="any" id="drp_fx" name="drp_fx" class="form-control">
							</div>
							<div class="col-md-4">
								<label for="drp_fees" class="form-label">{{ t('common.fees') }}</label>
								<input type="number" step="any" id="drp_fees" name="drp_fees" class="form-control drp-required">
							</div>
						</div>

						<!-- Buttons -->
						<div class="col-md-2">
							<button type="submit" class="btn app-btn-primary">{{ t('add_income.submit') }}</button>
						</div>

						<div class="col-md-2">
							<a class="btn app-btn-secondary" href="/incomes">{{ t('common.cancel') }}</a>
						</div>
					</form>

					<script>
						document.getElementById("drp-toggle").addEventListener("change", function () {
							const drpFields = document.getElementById("drp-fields");
							const isChecked = this.checked;

							// Show or hide DRP fields container
							drpFields.style.display = isChecked ? "flex" : "none";

							// Toggle required attribute for all .drp-required fields
							const requiredFields = drpFields.querySelectorAll(".drp-required");
							requiredFields.forEach(field => {
								if (isChecked) {
									field.setAttribute("required", "required");
								} else {
									field.removeAttribute("required");
								}
							});
						});
					</script>

			</div>
		</div>
	    
	    {% include "_footer.html" %}
    </div><!--//app-wrapper-->    					


	<!-- JavaScript -->
	<script src="{{ url_for('static', filename='assets/plugins/popper.min.js') }}"></script>
	<script src="{{ url_for('static', filename='assets/plugins/bootstrap/js/bootstrap.min.js') }}"></script>

	<!-- Charts JS -->
	<script src="{{ url_for('static', filename='assets/plugins/chart.js/chart.min.js') }}"></script>
	<script src="{{ url_for('static', filename='assets/js/index-charts.js') }}"></script>

	<!-- Page-Specific JS -->
	<script src="{{ url_for('static', filename='assets/js/app.js') }}"></script>

	{% include "loading.html" %}

</body>
</html>
